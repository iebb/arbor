name: Release

# Push a tag like v0.2.0 to build Arbor.app and publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Secrets can't be read in `if:`, so expose only whether they're set.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Arbor.xcodeproj -scheme Arbor -destination 'platform=macOS' -derivedDataPath build/DerivedData

      - name: Build Release app
        env:
          # Public half of the Sparkle update key (a repository variable). Empty = no auto-updates.
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -o pipefail
          VERSION="${TAG#v}"
          xcodebuild build \
            -project Arbor.xcodeproj \
            -scheme Arbor \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Release/Arbor.app "build/Arbor-$VERSION.zip"

      # Runs only when the Developer ID secrets are set; otherwise the release stays ad-hoc signed.
      - name: Sign with Developer ID and notarize
        id: notarize
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        if: env.HAS_DEVELOPER_ID == 'true'
        run: |
          VERSION="${TAG#v}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          scripts/sign-and-notarize.sh build/DerivedData/Build/Products/Release/Arbor.app "build/Arbor-$VERSION.zip"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Checksum
        run: |
          VERSION="${TAG#v}"
          # Write the bare file name so `shasum -c` works next to the downloaded zip.
          (cd build && shasum -a 256 "Arbor-$VERSION.zip" | tee "Arbor-$VERSION.zip.sha256")

      # Runs only when the Sparkle private key is set: signs the zip and writes the update feed.
      - name: Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        if: env.HAS_SPARKLE_KEY == 'true'
        run: |
          VERSION="${TAG#v}"
          SIGN_UPDATE=$(find build/DerivedData/SourcePackages/artifacts -name sign_update -type f | head -1)
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "build/Arbor-$VERSION.zip")
          cat > build/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Arbor</title>
              <item>
                <title>Arbor $VERSION</title>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/iebb/arbor/releases/tag/$TAG</sparkle:releaseNotesLink>
                <pubDate>$(date -R)</pubDate>
                <enclosure url="https://github.com/iebb/arbor/releases/download/$TAG/Arbor-$VERSION.zip" type="application/octet-stream" $SIGNATURE />
              </item>
            </channel>
          </rss>
          XML
          sed -i '' 's/^          //' build/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          VERSION="${TAG#v}"
          if [ "$NOTARIZED" = "true" ]; then
            echo "Arbor $VERSION for macOS 14 or later (Apple silicon and Intel). Signed and notarized." > notes.md
          else
            cat > notes.md <<NOTES
          Arbor $VERSION for macOS 14 or later (Apple silicon and Intel).

          This build is ad-hoc signed and not notarized. After unzipping, right-click Arbor.app and
          choose Open the first time, or run: xattr -dr com.apple.quarantine /Applications/Arbor.app
          NOTES
          fi
          ASSETS=("build/Arbor-$VERSION.zip" "build/Arbor-$VERSION.zip.sha256")
          [ -f build/appcast.xml ] && ASSETS+=("build/appcast.xml")
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Arbor $VERSION" --notes-file notes.md --generate-notes --verify-tag
