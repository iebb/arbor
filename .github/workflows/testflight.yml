name: TestFlight

# Archives the sandboxed Mac App Store edition ("Arbor Files", ad.neko.arbor),
# uploads it to App Store Connect, attaches it to the External TestFlight group,
# and submits it for External Beta App Review (non-fatal if another build is already in review).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (defaults to latest tag without leading v, e.g. 0.4.0)
        required: false
      group:
        description: External TestFlight group name
        required: false
        default: Public Beta

jobs:
  testflight:
    name: Upload to App Store Connect & External TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.TEAM_ID || '7P8CLHDH5G' }}
      BUNDLE_ID: ad.neko.arbor
      PROFILE_NAME: Arbor Files Mac App Store
      HAS_ASC_SECRETS: ${{ secrets.APPLE_DISTRIBUTION_P12 != '' && secrets.MAC_INSTALLER_P12 != '' && (secrets.ASC_KEY != '' || secrets.NOTARY_KEY != '') }}
    steps:
      - name: Check signing secrets
        if: env.HAS_ASC_SECRETS != 'true'
        run: |
          echo "Skipping TestFlight upload: set APPLE_DISTRIBUTION_P12, APPLE_DISTRIBUTION_P12_PASSWORD, MAC_INSTALLER_P12, MAC_INSTALLER_P12_PASSWORD, and ASC_KEY/ASC_KEY_ID/ASC_ISSUER (or NOTARY_KEY/NOTARY_KEY_ID/NOTARY_ISSUER)."
          exit 0

      - uses: actions/checkout@v4
        if: env.HAS_ASC_SECRETS == 'true'

      - name: Determine version
        if: env.HAS_ASC_SECRETS == 'true'
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.4.0)"
            VERSION="${LATEST#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen & Python JWT
        if: env.HAS_ASC_SECRETS == 'true'
        run: |
          brew install xcodegen
          python3 -m pip install --user --quiet PyJWT cryptography

      - name: Generate Xcode project
        if: env.HAS_ASC_SECRETS == 'true'
        run: xcodegen generate

      - name: Import signing certificates & provisioning profile
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY || secrets.NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER || secrets.NOTARY_ISSUER }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$MAC_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$MAC_INSTALLER_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          if [ -n "$APPSTORE_PROFILE_BASE64" ]; then
            echo "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/arbor.provisionprofile"
            cp "$HOME/Library/MobileDevice/Provisioning Profiles/arbor.provisionprofile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/arbor.provisionprofile"
          else
            # Fetch the Mac App Store provisioning profile directly from App Store Connect.
            python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request, jwt
          priv = open(os.path.join(os.environ["RUNNER_TEMP"], "asc.p8"), "rb").read()
          now = int(time.time())
          tok = jwt.encode(
              {"iss": os.environ["ASC_ISSUER"], "iat": now, "exp": now + 300, "aud": "appstoreconnect-v1"},
              priv, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]}
          )
          name = urllib.parse.quote(os.environ["PROFILE_NAME"])
          req = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/profiles?filter[name]={name}",
              headers={"Authorization": f"Bearer {tok}"}
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              profiles = json.loads(r.read().decode()).get("data", [])
          if not profiles:
              raise SystemExit(f"Profile '{os.environ['PROFILE_NAME']}' not found in App Store Connect")
          prof = profiles[0]["attributes"]
          raw = base64.b64decode(prof["profileContent"])
          for folder in [
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
          ]:
              with open(os.path.join(folder, f"{prof['uuid']}.provisionprofile"), "wb") as f:
                  f.write(raw)
          print("Installed profile:", prof["name"], prof["uuid"])
          PY
          fi

      - name: Archive and upload to App Store Connect
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER || secrets.NOTARY_ISSUER }}
        run: |
          set -o pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD="${{ steps.meta.outputs.build }}"
          ARCHIVE="build/ArborAppStore.xcarchive"

          xcodebuild archive \
            -project Arbor.xcodeproj -scheme "Arbor App Store" -configuration Release \
            -archivePath "$ARCHIVE" -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat > build/ExportOptions-AppStore.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/ExportOptions-AppStore.plist \
            -exportPath build/AppStoreExport \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER"

      - name: Configure External TestFlight & submit for beta review
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER || secrets.NOTARY_ISSUER }}
          ASC_BUNDLE_ID: ad.neko.arbor
          APP_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          TESTFLIGHT_GROUP: ${{ github.event.inputs.group || 'Public Beta' }}
        run: python3 scripts/testflight-distribute.py
